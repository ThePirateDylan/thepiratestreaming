name: Bug Report
description: Report a problem with The Pirate.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues before posting. Report one issue at a time.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Fire TV / Firestick
        - Android TV / Google TV
        - Android phone / tablet
        - Windows
        - Xbox
        - Linux / LibreELEC / CoreELEC
        - macOS
        - iOS / tvOS
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Fire TV Stick 4K Max
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - The Pirate (video add-on)
        - The Pirate Skin
        - TV Guide
        - The Pirate Audio
        - The Pirate Shortcuts
        - Maintenance
        - Installation / Updates
        - Other / Not sure
    validations:
      required: true
  - type: input
    id: kodi_version
    attributes:
      label: Kodi version
  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      description: If known, include the version of the affected add-on or skin.
  - type: textarea
    id: problem
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What were you doing when the issue occurred?
  - type: textarea
    id: debug_log
    attributes:
      label: Debug log
      description: |
        Include a [Kodi debug log](https://kodi.wiki/view/Log_file) for crashes and playback errors if available.
        Remove credentials, tokens and personal information before posting.
      placeholder: Paste a link to your log.
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Screenshots or anything else relevant to the issue.
